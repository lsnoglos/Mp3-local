name: Compilar APK Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compilar y probar
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log
      - name: Adjuntar registro de compilacion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Local-errores-gradle
          path: android-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Local-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
